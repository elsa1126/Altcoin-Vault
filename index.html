<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>山寨幣策略監控庫 | Altcoin Vault</title>
    
    <!-- iOS / Android Web App 設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="策略監控">
    <meta name="theme-color" content="#0B0E14">
    
    <!-- 網頁與 App 圖示設定 (請確保將圖示檔案命名為 icon.png 並放在同一資料夾內) -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="shortcut icon" href="icon.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0B0E14; color: #E2E8F0; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
        .glass-card:hover { border-color: rgba(59, 130, 246, 0.4); background: rgba(30, 41, 59, 0.6); }
        input[type="number"], select { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; border-radius: 6px; }
        input:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        /* 目標達成——發光金框 */
        @keyframes gold-pulse {
            0%, 100% { box-shadow: 0 0 12px rgba(251,191,36,0.4), 0 0 30px rgba(251,191,36,0.15); }
            50%       { box-shadow: 0 0 24px rgba(251,191,36,0.7), 0 0 55px rgba(251,191,36,0.3); }
        }
        .card-target-hit {
            border: 1px solid rgba(251,191,36,0.75) !important;
            background: rgba(40, 35, 15, 0.55) !important;
            animation: gold-pulse 2s ease-in-out infinite;
        }
        .card-target-hit:hover { border-color: rgba(251,191,36,1) !important; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 pb-20">

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 border-b border-slate-800 pb-6 gap-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white flex items-center gap-3">
                    策略監控庫 <span class="text-[10px] bg-blue-500/20 text-blue-400 px-2 py-1 rounded tracking-widest border border-blue-500/30">PRO</span>
                </h1>
                <p class="text-slate-500 text-sm mt-2">自動化階梯報價：Pionex &rarr; Gate.io &rarr; OKX</p>
            </div>
            <div class="flex flex-col items-end gap-1">
                <div id="status-indicator" class="text-sm text-green-400 flex items-center gap-2">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    市場連線正常
                </div>
                <div class="text-[11px] text-slate-500 font-mono uppercase">下次更新: <span id="countdown" class="text-blue-400">180</span> 秒</div>
                <div class="flex gap-1.5 mt-0.5">
                    <button onclick="exportSettings()" title="匯出策略備份 JSON" class="text-[10px] px-2 py-1 bg-slate-800/80 text-slate-400 border border-slate-700 rounded hover:bg-amber-500/20 hover:text-amber-400 hover:border-amber-500/50 transition font-bold">⬇ 匯出</button>
                    <button onclick="importSettings()" title="匯入策略備份 JSON" class="text-[10px] px-2 py-1 bg-slate-800/80 text-slate-400 border border-slate-700 rounded hover:bg-blue-500/20 hover:text-blue-400 hover:border-blue-500/50 transition font-bold">⬆ 匯入</button>
                </div>
            </div>
        </div>

        <div class="mb-5 bg-slate-900/40 p-4 rounded-xl border border-slate-800/50">
            <details class="group">
                <summary class="text-xs text-slate-400 font-bold cursor-pointer outline-none hover:text-white transition flex justify-between items-center list-none">
                    <span class="flex items-center gap-2">⚙️ 系統設定與授權 (Admin)</span>
                    <span id="sync-status" class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-500">訪客觀看模式</span>
                </summary>
                <div class="mt-4 border-t border-slate-800 pt-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] text-slate-500 mb-1.5 font-bold uppercase">預設載入區域 (Bin ID)</label>
                            <div class="flex gap-2">
                                <input type="text" id="sync-bin" placeholder="訪客預設會讀取此 Bin ID" class="flex-1 text-xs p-2 bg-slate-800 border border-slate-700 text-white rounded">
                                <button id="guest-refresh-btn" onclick="guestRefresh()" class="px-3 bg-green-600/20 text-green-400 border border-green-500/30 rounded text-xs hover:bg-green-600/40 transition font-bold whitespace-nowrap">重新讀取 🔄</button>
                            </div>
                        </div>
                        <div class="flex flex-col gap-3">
                            <div>
                                <label class="block text-[10px] text-slate-500 mb-1.5 font-bold uppercase">管理員帳號</label>
                                <input type="email" id="admin-user" placeholder="輸入帳號..." class="w-full text-xs p-2 bg-slate-800 border border-slate-700 text-white rounded" autocomplete="off">
                            </div>
                            <div>
                                <label class="block text-[10px] text-slate-500 mb-1.5 font-bold uppercase">管理員密碼</label>
                                <div class="flex gap-2">
                                    <input type="password" id="admin-pass" placeholder="輸入密碼..." class="flex-1 text-xs p-2 bg-slate-800 border border-slate-700 text-white rounded" autocomplete="off">
                                    <button onclick="toggleAdminLogin()" id="login-btn" class="px-3 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded text-xs hover:bg-blue-600/40 transition font-bold">登入</button>
                                </div>
                            </div>
                        </div>
                        <div id="admin-tools" class="md:col-span-2 flex flex-col md:flex-row gap-2 hidden">
                            <button onclick="createCloudBin()" class="flex-1 py-2 text-xs bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 rounded hover:bg-indigo-600/40 transition font-bold shadow-lg">1. 建立全新公開區塊 (Public Bin)</button>
                            <button id="push-btn" onclick="pushToCloud(true)" class="flex-1 py-2 text-xs bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded hover:bg-blue-600/40 transition font-bold shadow-lg">強制上傳/覆蓋雲端 ⬆️</button>
                            <button id="fetch-btn" onclick="fetchFromCloud(false)" class="flex-1 py-2 text-xs bg-green-600/20 text-green-400 border border-green-500/30 rounded hover:bg-green-600/40 transition font-bold shadow-lg">2. 從雲端強制讀取 ⬇️</button>
                        </div>
                    </div>
                    <div class="mt-4 text-[11px] text-slate-400 bg-slate-800/50 p-2 rounded leading-relaxed border border-slate-700/50">
                        <span class="text-white font-bold">💡 如何分享給別人觀看？</span><br>
                        先解鎖編輯狀態，點選「1. 建立全新公開區塊」取得一組 <span class="text-blue-400">Bin ID</span>。<br>
                        然後用文字編輯器打開這份 <code>index.html</code> 檔案，將大約第 112 行的 <code>DEFAULT_BIN_ID</code> 替換成您的這組 <span class="text-blue-400">Bin ID</span>。<br>
                        重新發布後，任何訪客進入網頁預設都會載入您的清單，但<span class="text-red-400">只有持有 Master Key 的人能解鎖並修改內容！</span>
                    </div>
                </div>
            </details>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 bg-slate-900/40 p-4 rounded-xl border border-slate-800/50">
            <div class="md:col-span-1">
                <label class="block text-[11px] text-slate-500 mb-1.5 font-bold">搜尋幣種</label>
                <input type="text" id="searchInput" placeholder="輸入名稱 (如: PEPE)..." class="w-full px-4 py-2 bg-slate-900/60 border border-slate-800 text-sm focus:ring-1 focus:ring-blue-500 outline-none transition-all">
            </div>
            <div class="md:col-span-2">
                <label class="block text-[11px] text-slate-500 mb-1.5 font-bold">自訂排序條件</label>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <button onclick="changeSort('name')" class="sort-btn px-3 py-2 text-xs rounded bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700" id="sort-name">名稱 (A-Z)</button>
                    <button onclick="changeSort('targetDist')" class="sort-btn px-3 py-2 text-xs rounded bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700" id="sort-targetDist">目標距離</button>
                    <button onclick="changeSort('change')" class="sort-btn px-3 py-2 text-xs rounded bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700" id="sort-change">24H 漲幅</button>
                    <button onclick="changeSort('updateTime')" class="sort-btn px-3 py-2 text-xs rounded bg-blue-600/20 text-blue-400 border border-blue-500/40" id="sort-updateTime">更新時間</button>
                </div>
            </div>
        </div>

        <div id="coin-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <div class="col-span-full py-20 text-center flex flex-col items-center gap-4">
                <div class="w-8 h-8 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin"></div>
                <p class="text-slate-500 animate-pulse text-sm">正在從全球交易所同步最新行情...</p>
            </div>
        </div>
    </div>

    <script>
        const COIN_LIST = ['1INCH', 'A', 'A2Z', 'AB', 'ACH', 'ACT', 'AEVO', 'AGI', 'AI', 'ALGO', 'ALT', 'ANIME', 'APE', 'APT', 'ARPA', 'ATA', 'AWE', 'AXS', 'BABYDOGE', 'BAN', 'BEL', 'BLUR', 'BOME', 'BONK', 'C98', 'CAKE', 'CAT', 'CELR', 'CFX', 'CHR', 'CHZ', 'CKB', 'COS', 'COTI', 'CRO', 'CSPR', 'CTSI', 'CVC', 'DEGO', 'DENT', 'DGB', 'DODO', 'DOGE', 'DOGS', 'DOT', 'DUSK', 'EDU', 'ENA', 'ENJ', 'ENS', 'FET', 'FLM', 'FLOKI', 'FLR', 'FORM', 'FTT', 'FUN', 'GALA', 'GEAR', 'GMT', 'GOAT', 'GRT', 'GT', 'HBAR', 'HFT', 'HIGH', 'HIVE', 'HMSTR', 'HOOK', 'HTX', 'ICP', 'ID', 'IDEX', 'IMX', 'IO', 'IOST', 'IOTA', 'IQ', 'JASMY', 'JOE', 'KAVA', 'KDA', 'KNC', 'LAT', 'LINK', 'LRC', 'LTC', 'LUNC', 'MANA', 'MANTA', 'MAV', 'MBOX', 'MEME', 'MOG', 'NEAR', 'NEIRO', 'NFT', 'NKN', 'NOT', 'OM', 'ONE', 'OXT', 'PENGU', 'PEOPLE', 'PEPE', 'PHA', 'PI', 'PIXEL', 'PNUT', 'POL', 'POND', 'PORTAL', 'PSG', 'PYTH', 'QKC', 'RAD', 'RARE', 'RATS', 'RDNT', 'RSR', 'RUNE', 'SAND', 'SATS', 'SEI', 'SFP', 'SHIB', 'SKL', 'SOL', 'SPELL', 'STRK', 'STX', 'SUI', 'SUSHI', 'SYS', 'TFUEL', 'THETA', 'TKO', 'TLM', 'TRUMP', 'TRX', 'TURBO', 'UNI', 'VOXEL', 'VTHO', 'W', 'WAXP', 'WEN', 'WIN', 'WOO', 'XAI', 'XEC', 'XVG', 'XVS', 'YGG', 'ZBCN', 'ZIL'];
        const PROXY_URL = 'https://cors.eu.org/'; 
        let marketData = {};
        let currentSort = 'updateTime';
        let editingCoin = null; // 编辑中的幣種，有値時跟止 renderCards() 覆蓋 UI
        let userSettings = JSON.parse(localStorage.getItem('coinSettingsV3')) || {};

        // 雲端同步與權限設定
        const DEFAULT_BIN_ID = '69ef9d4636566621a8fa2ae7'; // 公開雲端區塊 ID，訪客打開頁面即自動同步最新資料
        const DEFAULT_API_KEY = '$2a$10$7hoFNnd/YF8ugM4NxoifIubFXp7cDTdzZKsB8uuR2vxc0cX8cbSAC';
        const ADMIN_USER = 'a0983818451@gmail.com';
        const ADMIN_PASS = 'Jack09040904';

        let isAdmin = localStorage.getItem('isAdmin') === 'true';
        let cloudKey = isAdmin ? DEFAULT_API_KEY : '';
        let cloudBin = localStorage.getItem('syncBin') || DEFAULT_BIN_ID;

        setTimeout(() => {
            if(document.getElementById('admin-user')) {
                document.getElementById('sync-bin').value = cloudBin;
                updateSyncStatus();
                if(isAdmin) {
                    document.getElementById('admin-user').value = ADMIN_USER;
                    document.getElementById('admin-pass').value = '********';
                    document.getElementById('admin-user').disabled = true;
                    document.getElementById('admin-pass').disabled = true;
                    document.getElementById('admin-tools').classList.remove('hidden');
                    document.getElementById('login-btn').innerText = '登出';
                    document.getElementById('login-btn').classList.replace('text-blue-400', 'text-red-400');
                    document.getElementById('login-btn').classList.replace('bg-blue-600/20', 'bg-red-600/20');
                    document.getElementById('login-btn').classList.replace('border-blue-500/30', 'border-red-500/30');
                }
            }
            if(cloudBin && !isAdmin && Object.keys(userSettings).every(k => !userSettings[k].target && !userSettings[k].entry)) {
                // 訪客模式，如果預設有 Bin ID 且目前沒有任何設定資料，自動偷偷下載一次資料
                fetchFromCloud(true);
            }
        }, 100);

        function toggleAdminLogin() {
            if(isAdmin) {
                localStorage.removeItem('isAdmin');
                alert("已登出管理者模式，轉換為訪客觀看狀態。");
                location.reload();
            } else {
                const user = document.getElementById('admin-user').value.trim();
                const pass = document.getElementById('admin-pass').value.trim();
                if(user === ADMIN_USER && pass === ADMIN_PASS) {
                    localStorage.setItem('isAdmin', 'true');
                    alert("登入成功！已切換至 PRO 管理者模式。");
                    location.reload();
                } else {
                    alert("登入失敗：帳號或密碼錯誤！");
                }
            }
        }

        function updateSyncStatus() {
            const statusBadge = document.getElementById('sync-status');
            if(isAdmin && cloudBin) {
                statusBadge.className = "text-[10px] px-2 py-0.5 rounded bg-green-500/20 text-green-400";
                statusBadge.innerText = "PRO 管理者模式";
            } else if (!isAdmin && cloudBin) {
                statusBadge.className = "text-[10px] px-2 py-0.5 rounded bg-blue-500/20 text-blue-400";
                statusBadge.innerText = "唯讀訪客模式";
            } else {
                statusBadge.className = "text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-500";
                statusBadge.innerText = "本地端未連線";
            }
        }

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 text-xs px-4 py-2 rounded-lg shadow-lg z-50 transition-all ${ type === 'success' ? 'bg-green-600/90 text-white' : 'bg-red-600/90 text-white' }`;
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function saveSyncConfig() {
            const binInput = document.getElementById('sync-bin');
            if (binInput) {
                cloudBin = binInput.value.trim();
                localStorage.setItem('syncBin', cloudBin);
            }
            updateSyncStatus();
        }

        async function guestRefresh() {
            const btn = document.getElementById('guest-refresh-btn');
            if (btn) { btn.innerText = '讀取中...'; btn.disabled = true; }
            saveSyncConfig();
            if (!cloudBin) {
                alert('尚無預設 Bin ID，請聯繫管理員！');
                if (btn) { btn.innerText = '重新讀取 🔄'; btn.disabled = false; }
                return;
            }
            await fetchFromCloud(false);
            if (btn) { btn.innerText = '重新讀取 🔄'; btn.disabled = false; }
        }

        async function createCloudBin() {
            saveSyncConfig();
            if(!cloudKey) return alert("請先填寫 Master Key！");
            try {
                const res = await fetch("https://api.jsonbin.io/v3/b", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': cloudKey, 'X-Bin-Name': 'AltcoinVaultSync', 'X-Bin-Private': 'false' },
                    body: JSON.stringify(userSettings)
                });
                const data = await res.json();
                if(data.record) {
                    cloudBin = data.metadata.id;
                    document.getElementById('sync-bin').value = cloudBin;
                    saveSyncConfig();
                    alert("✅ 成功建立公開雲端區塊！\n\n您的 Bin ID 是: " + cloudBin + "\n\n1. 請將程式碼約第112行的 DEFAULT_BIN_ID 替換成這組代碼！\n2. 這樣別人就不需要密碼也能觀看了！");
                } else {
                    alert("❌ 建立失敗：" + JSON.stringify(data));
                }
            } catch(e) { alert("❌ 網路請求錯誤：" + e); }
        }

        async function pushToCloud(isManual = false) {
            if(!cloudKey || !cloudBin) {
                if(isManual) alert("請先建立公開區塊或填寫 Bin ID！");
                return;
            }
            
            const pushBtn = document.getElementById('push-btn');
            if (isManual && pushBtn) pushBtn.innerText = "上傳中...";

            try {
                const res = await fetch("https://api.jsonbin.io/v3/b/" + cloudBin, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': cloudKey },
                    body: JSON.stringify(userSettings)
                });
                if(res.status === 401 || res.status === 403) {
                    alert("更新失敗：授權碼 (Master Key) 錯誤或無權限！已登出。");
                    toggleAdminLogin();
                } else if (res.ok && isManual) {
                    alert("✅ 成功同步至雲端最新狀態！");
                }
            } catch(e) { 
                console.error("Cloud Error", e); 
                if (isManual) alert("❌ 上傳失敗: " + e.message);
            }

            if (isManual && pushBtn) pushBtn.innerText = "強制上傳/覆蓋雲端 ⬆️";
        }

        async function fetchFromCloud(silent = false) {
            if(!silent) saveSyncConfig();
            if(!cloudBin) {
                if(!silent) showToast('請先填寫 Bin ID！', 'error');
                return;
            }
            
            try {
                // 讀取時永遠帶 key：訪客用預設 key（已寫死在程式碼中），管理員用自己的 key
                // 這樣私有 Bin 也能讀取，但沒有 Master Key 依然無法寫入
                const readKey = cloudKey || DEFAULT_API_KEY;
                const headers = { 'X-Master-Key': readKey };

                const res = await fetch("https://api.jsonbin.io/v3/b/" + cloudBin + "/latest", {
                    method: 'GET',
                    headers: headers
                });
                const data = await res.json();
                if(data.record) {
                    // 將雲端資料寫入 userSettings
                    const cloudData = data.record;
                    // 確保所有契種字段完整
                    COIN_LIST.forEach(coin => {
                        if (cloudData[coin]) {
                            userSettings[coin] = {
                                entry: cloudData[coin].entry || 0,
                                target: cloudData[coin].target || 0,
                                stopLoss: cloudData[coin].stopLoss || 0,
                                isHolding: cloudData[coin].isHolding || false,
                                lastManualUpdate: cloudData[coin].lastManualUpdate || 0,
                                note: cloudData[coin].note || '',
                                entrySide: cloudData[coin].entrySide || null,
                                capital: cloudData[coin].capital || 0,
                                leverage: cloudData[coin].leverage || 1
                            };
                        }
                    });
                    saveSettings();
                    renderCards();
                    if(!silent) showToast("✅ 已從雲端讀取最新資料！");
                } else {
                    if(!silent) showToast("❌ 讀取失敗: " + (data.message || JSON.stringify(data)), 'error');
                }
            } catch(e) { 
                if(!silent) showToast("❌ 網路錯誤: " + e.message, 'error');
            }
        }

        // 初始化設定
        COIN_LIST.forEach(coin => {
            if (!userSettings[coin]) {
                userSettings[coin] = { entry: 0, target: 0, stopLoss: 0, isHolding: false, lastManualUpdate: 0, note: '', entrySide: null, capital: 0, leverage: 1 };
            } else {
                if (userSettings[coin].note === undefined) userSettings[coin].note = '';
                if (userSettings[coin].entrySide === undefined) userSettings[coin].entrySide = null;
                if (userSettings[coin].capital === undefined) userSettings[coin].capital = 0;
                if (userSettings[coin].leverage === undefined) userSettings[coin].leverage = 1;
            }
        });

        function saveSettings() {
            localStorage.setItem('coinSettingsV3', JSON.stringify(userSettings));
        }

        // ── 自動進場偵測 ──────────────────────────────────────────
        function checkAutoEntry() {
            let triggered = [];
            COIN_LIST.forEach(coin => {
                const set = userSettings[coin];
                const mkt = marketData[coin];
                if (!set || !mkt || set.isHolding || !set.entry || !set.entrySide) return;
                const price = Number(mkt.price);
                const entry = Number(set.entry);
                if (price <= 0 || entry <= 0) return;

                let shouldEnter = false;
                if (set.entrySide === 'breakout' && price >= entry) shouldEnter = true;
                if (set.entrySide === 'dip'      && price <= entry) shouldEnter = true;

                if (shouldEnter) {
                    userSettings[coin].isHolding = true;
                    userSettings[coin].entrySide = null;
                    userSettings[coin].lastManualUpdate = Date.now();
                    triggered.push(coin);
                }
            });
            if (triggered.length > 0) {
                saveSettings();
                pushToCloud(false);
                if (!editingCoin) { renderCards(); }
                triggered.forEach(c => showToast(`🚀 ${c} 已自動切換為進場！`, 'success'));
            }
        }

        // ── 匯出 / 匯入備份 ───────────────────────────────────────
        function exportSettings() {
            const data = JSON.stringify(userSettings, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href = url;
            const d = new Date();
            a.download = `altcoin_vault_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('✅ 策略備份已匯出！');
        }

        function importSettings() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        let count = 0;
                        COIN_LIST.forEach(coin => {
                            if (imported[coin]) {
                                userSettings[coin] = Object.assign({}, userSettings[coin], imported[coin]);
                                count++;
                            }
                        });
                        saveSettings();
                        renderCards();
                        showToast(`✅ 已匯入 ${count} 筆策略！`);
                    } catch(err) {
                        showToast('❌ 匯入失敗：格式不正確', 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        async function fetchExchangeData() {
            try {
                const [pRes, gRes, oRes] = await Promise.all([
                    fetch(PROXY_URL + encodeURIComponent('https://api.pionex.com/api/v1/market/tickers')),
                    fetch(PROXY_URL + encodeURIComponent('https://api.gateio.ws/api/v4/spot/tickers')),
                    fetch(PROXY_URL + encodeURIComponent('https://www.okx.com/api/v5/market/tickers?instType=SPOT'))
                ]);
                
                const pData = await pRes.json();
                const gData = await gRes.json();
                const oData = await oRes.json();

                let pMap = {}, gMap = {}, oMap = {};
                if(pData.data) pData.data.tickers.forEach(t => { if(t.symbol.endsWith('_USDT')) pMap[t.symbol.split('_')[0]] = { price: t.close, change: t.change !== undefined ? t.change*100 : ((t.close - t.open) / t.open) * 100, vol: t.volume, src: 'Pionex' } });
                if(Array.isArray(gData)) gData.forEach(t => { if(t.currency_pair.endsWith('_USDT')) gMap[t.currency_pair.split('_')[0]] = { price: t.last, change: t.change_percentage, vol: t.base_volume, src: 'Gate' } });
                if(oData.data) oData.data.forEach(t => { if(t.instId.endsWith('-USDT')) oMap[t.instId.split('-')[0]] = { price: t.last, change: ((t.last-t.open24h)/t.open24h)*100, vol: t.vol24h, src: 'OKX' } });

                marketData = {};
                COIN_LIST.forEach(coin => {
                    marketData[coin] = pMap[coin] || gMap[coin] || oMap[coin] || { price: 0, change: 0, vol: 0, src: '--' };
                });
                if (!editingCoin) { renderCards(); }
                checkAutoEntry();
            } catch (e) {
                console.error("更新失敗:", e);
                document.getElementById('status-indicator').innerHTML = '<span class="text-red-500">網路連線異常</span>';
            }
        }

        function changeSort(type) {
            currentSort = type;
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600/20', 'text-blue-400', 'border-blue-500/40');
                btn.classList.add('bg-slate-800', 'text-slate-400', 'border-slate-700');
            });
            document.getElementById(`sort-${type}`).classList.add('bg-blue-600/20', 'text-blue-400', 'border-blue-500/40');
            renderCards();
        }

        function toggleEdit(coin) {
            const displayDiv = document.getElementById(`display-${coin}`);
            const editDiv = document.getElementById(`edit-${coin}`);
            if (editDiv.classList.contains('hidden')) {
                displayDiv.classList.add('hidden');
                editDiv.classList.remove('hidden');
                editingCoin = coin; // 標記目前編輯中的幣種
            } else {
                const newEntry     = parseFloat(document.getElementById(`entry-${coin}`).value) || 0;
                const newIsHolding = document.getElementById(`holding-${coin}`).value === 'true';

                userSettings[coin].entry    = newEntry;
                userSettings[coin].target   = parseFloat(document.getElementById(`target-${coin}`).value) || 0;
                userSettings[coin].stopLoss = parseFloat(document.getElementById(`sl-${coin}`).value) || 0;
                userSettings[coin].isHolding = newIsHolding;
                userSettings[coin].note = document.getElementById(`note-${coin}`) ? document.getElementById(`note-${coin}`).value : '';
                userSettings[coin].capital  = parseFloat(document.getElementById(`capital-${coin}`).value) || 0;
                userSettings[coin].leverage = parseFloat(document.getElementById(`leverage-${coin}`).value) || 1;
                userSettings[coin].lastManualUpdate = Date.now();

                // ── 定向觸及判斷：儲存時自動標記方向 ──
                if (!newIsHolding && newEntry > 0) {
                    const currentPrice = Number((marketData[coin] || {}).price || 0);
                    if (currentPrice > 0 && currentPrice < newEntry) {
                        userSettings[coin].entrySide = 'breakout'; // 現價低於進場價 → 等待向上突破
                    } else if (currentPrice > 0 && currentPrice > newEntry) {
                        userSettings[coin].entrySide = 'dip';      // 現價高於進場價 → 等待回測接刀
                    } else {
                        userSettings[coin].entrySide = null;       // 價格相同，不自動偵測
                    }
                } else {
                    userSettings[coin].entrySide = null; // 手動設為持倉 or 未設進場價 → 關閉自動偵測
                }

                editingCoin = null; // 清除編輯結束的旗標
                saveSettings();
                renderCards();

                const indicator = document.getElementById('sync-status');
                const oldText = indicator.innerText;
                const oldClass = indicator.className;
                indicator.className = "text-[10px] px-2 py-0.5 rounded bg-yellow-500/20 text-yellow-500";
                indicator.innerText = "正在上傳雲端...";
                pushToCloud(false).then(() => {
                    indicator.className = oldClass;
                    indicator.innerText = oldText;
                });
            }
        }

        function formatPrice(p) {
            const num = Number(p);
            if(num === 0) return '---';
            if(num < 0.0001) return num.toLocaleString('en-US', { maximumSignificantDigits: 4 });
            if(num < 1) return num.toLocaleString('en-US', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
            return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatRelativeTime(ts) {
            if(!ts) return '未曾設定';
            const diff = Date.now() - ts;
            if(diff < 60000) return '剛剛';
            const mins = Math.floor(diff/60000);
            if(mins < 60) return `${mins} 分鐘前`;
            const hours = Math.floor(mins/60);
            if(hours < 24) return `${hours} 小時前`;
            const date = new Date(ts);
            return `${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${date.getMinutes().toString().padStart(2,'0')}`;
        }

        // 狀態徽章 helper
        function getStatusBadge(set) {
            if (set.isHolding)
                return '<span class="text-[10px] px-2 py-1 rounded border border-blue-500/50 text-blue-400 bg-blue-500/5">● 持倉中</span>';
            if (set.entrySide === 'breakout')
                return '<span class="text-[10px] px-2 py-1 rounded border border-amber-500/50 text-amber-400 bg-amber-500/10">⬆ 等待突破</span>';
            if (set.entrySide === 'dip')
                return '<span class="text-[10px] px-2 py-1 rounded border border-cyan-500/50 text-cyan-400 bg-cyan-500/10">⬇ 等待接刀</span>';
            return '<span class="text-[10px] px-2 py-1 rounded border border-slate-700 text-slate-500">○ 觀望中</span>';
        }

        function renderCards() {
            const container = document.getElementById('coin-container');
            const searchVal = document.getElementById('searchInput').value.toUpperCase();

            let sortedList = COIN_LIST.filter(c => c.includes(searchVal)).sort((a, b) => {
                const mktA = marketData[a], mktB = marketData[b];
                const setA = userSettings[a], setB = userSettings[b];
                if (currentSort === 'name') return a.localeCompare(b);
                if (currentSort === 'change') return mktB.change - mktA.change;
                if (currentSort === 'updateTime') return setB.lastManualUpdate - setA.lastManualUpdate;
                if (currentSort === 'targetDist') {
                    const getDist = (m, s) => (s.target > 0 && m.price > 0) ? (s.target - m.price) / m.price : 9999;
                    return getDist(mktA, setA) - getDist(mktB, setB);
                }
            });

            container.innerHTML = '';
            sortedList.forEach(coin => {
                // 防魔：如果市場資料尚未載入就跳過，避免崩潰
                const mkt = marketData[coin] || { price: 0, change: 0, vol: 0, src: '--' };
                const set = userSettings[coin] || { entry: 0, target: 0, stopLoss: 0, isHolding: false, lastManualUpdate: 0, note: '' };
                const isUp = Number(mkt.change) >= 0;
                const priceColor = isUp ? 'text-green-400' : 'text-red-400';
                
                let distanceText = '';
                if(mkt.price > 0) {
                    const price = Number(mkt.price);
                    const entry = Number(set.entry);
                    if(set.isHolding) {
                        let leftPart = '', rightPart = '';
                        if (entry > 0) {
                            const ed = ((price - entry) / entry * 100);
                            const edSign = ed >= 0 ? '+' : '';
                            const edColor = ed >= 0 ? 'text-green-400' : 'text-red-400';
                            leftPart = `<span class="flex items-center gap-1"><span class="text-slate-500">距進場:</span><span class="${edColor} font-mono">${edSign}${ed.toFixed(2)}%</span></span>`;
                        }
                        if (set.target > 0) {
                            const d = ((set.target - price) / price * 100).toFixed(2);
                            rightPart = `<span class="flex items-center gap-1"><span class="text-slate-500">距目標:</span><span class="${d <= 0 ? 'text-green-400 font-bold' : 'text-blue-400'} font-mono">${d}%</span></span>`;
                        }
                        if (leftPart || rightPart) {
                            distanceText = `<div class="mt-3 flex justify-between text-xs">${leftPart}${rightPart}</div>`;
                        }
                    } else if (!set.isHolding && entry > 0) {
                        if (set.entrySide === 'breakout') {
                            const gap = ((entry - price) / entry * 100).toFixed(2);
                            distanceText = `<div class="mt-3 flex justify-between text-xs"><span class="text-slate-500">距突破進場:</span><span class="text-amber-400">+${gap}%</span></div>`;
                        } else if (set.entrySide === 'dip') {
                            const gap = ((price - entry) / entry * 100).toFixed(2);
                            distanceText = `<div class="mt-3 flex justify-between text-xs"><span class="text-slate-500">距接刀進場:</span><span class="text-cyan-400">-${gap}%</span></div>`;
                        } else {
                            const dValue = ((entry - price) / entry * 100);
                            if (dValue < 0) {
                                distanceText = `<div class="mt-3 text-center py-2 text-xs font-bold text-red-400 bg-red-900/20 rounded border border-red-500/20">似乎錯過了</div>`;
                            } else {
                                distanceText = `<div class="mt-3 text-center py-1 text-xs text-slate-500 bg-slate-800/40 rounded">與計畫進場價落差: +${dValue.toFixed(2)}%</div>`;
                            }
                        }
                    }
                }

                // ── 即時盈虧計算 ──
                let pnlText = '';
                if (set.isHolding && set.capital > 0 && Number(set.entry) > 0 && Number(mkt.price) > 0) {
                    const p = Number(mkt.price), e = Number(set.entry), lev = Number(set.leverage) || 1;
                    const pnlPct = (p - e) / e * lev * 100;
                    const pnlUsd = set.capital * lev * (p - e) / e;
                    const sign = pnlPct >= 0 ? '+' : '';
                    const pnlColor = pnlPct >= 0 ? 'text-green-400' : 'text-red-400';
                    const pnlBg   = pnlPct >= 0 ? 'bg-green-900/20 border-green-500/20' : 'bg-red-900/20 border-red-500/20';
                    pnlText = `<div class="mt-2 flex justify-between items-center text-xs px-3 py-1.5 rounded-lg border ${pnlBg}"><span class="text-slate-400">💰 即時盈虧 <span class="text-slate-600">(${lev}x)</span></span><span class="${pnlColor} font-mono font-bold">${sign}$${Math.abs(pnlUsd).toFixed(2)}</span></div>`;
                }

                const card = document.createElement('div');
                const targetHit = set.isHolding && set.target > 0 && Number(mkt.price) >= Number(set.target);
                card.className = targetHit
                    ? 'glass-card card-target-hit rounded-2xl p-5 flex flex-col'
                    : 'glass-card rounded-2xl p-5 border border-slate-800 flex flex-col';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-white tracking-tight">${coin}</span>
                                <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-500 uppercase">${mkt.src}</span>
                                ${set.note ? `<span class="text-[10px] text-yellow-400/90 bg-yellow-500/20 px-1.5 py-0.5 rounded border border-yellow-500/30 max-w-[80px] truncate" title="${set.note}">${set.note}</span>` : ''}
                            </div>
                            <div class="text-xl font-mono mt-1 ${priceColor}">${formatPrice(mkt.price)}</div>
                        </div>
                        <div class="text-right">
                            <div class="${priceColor} text-xs font-bold bg-slate-900/50 px-2 py-1 rounded">${isUp ? '+' : ''}${Number(mkt.change).toFixed(2)}%</div>
                            <div class="text-[10px] text-slate-600 mt-1.5 uppercase font-mono">Vol: ${Number(mkt.vol/1000).toFixed(0)}K</div>
                        </div>
                    </div>

                    <div class="bg-black/30 p-4 rounded-xl border border-white/5 space-y-4">
                        <div id="display-${coin}">
                            <div class="flex justify-between items-center mb-3">
                                ${getStatusBadge(set)}
                                ${isAdmin ? `<button onclick="toggleEdit('${coin}')" class="text-slate-500 hover:text-white transition-colors">編輯計畫 ✏️</button>` : ''}
                            </div>
                            <div class="grid grid-cols-3 gap-1 text-[10px] text-center">
                                <div><p class="text-slate-600 mb-1 uppercase">Entry</p><p class="font-mono break-all">${set.entry ? formatPrice(set.entry) : '--'}</p></div>
                                <div><p class="text-green-500/60 mb-1 uppercase">Target</p><p class="font-mono break-all">${set.target ? formatPrice(set.target) : '--'}</p></div>
                                <div><p class="text-red-500/60 mb-1 uppercase">Stop</p><p class="font-mono break-all">${set.stopLoss ? formatPrice(set.stopLoss) : '--'}</p></div>
                            </div>
                            ${distanceText}
                            ${pnlText}
                        </div>

                        <div id="edit-${coin}" class="hidden">
                            <div class="grid grid-cols-2 gap-3 mb-3">
                                <div class="col-span-2">
                                    <label class="text-[10px] text-slate-500 uppercase block mb-1">交易狀態</label>
                                    <select id="holding-${coin}" class="w-full text-xs p-2">
                                        <option value="false" ${!set.isHolding ? 'selected' : ''}>觀望中 (Watching)</option>
                                        <option value="true" ${set.isHolding ? 'selected' : ''}>已進場 (Holding)</option>
                                    </select>
                                </div>
                                <div><label class="text-[10px] text-slate-500 uppercase block mb-1">進場價</label><input type="number" id="entry-${coin}" value="${set.entry || ''}" placeholder="0" onfocus="if(parseFloat(this.value)===0)this.value=''" onblur="if(this.value==='')this.value='0'" class="w-full text-xs p-2"></div>
                                <div><label class="text-[10px] text-red-500/50 uppercase block mb-1">停損價</label><input type="number" id="sl-${coin}" value="${set.stopLoss || ''}" placeholder="0" onfocus="if(parseFloat(this.value)===0)this.value=''" onblur="if(this.value==='')this.value='0'" class="w-full text-xs p-2"></div>
                                <div><label class="text-[10px] text-green-500/50 uppercase block mb-1">目標價</label><input type="number" id="target-${coin}" value="${set.target || ''}" placeholder="0" onfocus="if(parseFloat(this.value)===0)this.value=''" onblur="if(this.value==='')this.value='0'" class="w-full text-xs p-2"></div>
                                <div><label class="text-[10px] text-yellow-500/50 uppercase block mb-1">備註 (十字內)</label><input type="text" id="note-${coin}" value="${set.note || ''}" maxlength="10" placeholder="可選填..." class="w-full text-xs p-2" style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; border-radius: 6px;"></div>
                                <div class="col-span-2 mt-1 pt-3 border-t border-slate-800/50"><p class="text-[10px] text-purple-400/70 uppercase mb-2 font-bold">💰 資金計算</p><div class="grid grid-cols-2 gap-3"><div><label class="text-[10px] text-slate-500 uppercase block mb-1">本金 (USDT)</label><input type="number" id="capital-${coin}" value="${set.capital || ''}" placeholder="0" onfocus="if(parseFloat(this.value)===0)this.value=''" onblur="if(this.value==='')this.value='0'" class="w-full text-xs p-2"></div><div><label class="text-[10px] text-slate-500 uppercase block mb-1">槓桿 (x)</label><input type="number" id="leverage-${coin}" value="${set.leverage || 1}" min="1" max="100" onfocus="if(parseFloat(this.value)===1&&'${set.capital}'==='0')this.value=''" onblur="if(this.value===''||parseFloat(this.value)<1)this.value='1'" class="w-full text-xs p-2"></div></div></div>
                            </div>
                            <button onclick="toggleEdit('${coin}')" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs rounded-lg font-bold transition-all shadow-lg shadow-blue-900/20">儲存並記錄時間</button>
                        </div>
                    </div>
                    
                    <div class="mt-4 pt-3 border-t border-slate-800/50 flex justify-between items-center text-[10px]">
                        <span class="text-slate-700 tracking-widest uppercase">Last Update</span>
                        <span class="text-slate-500 font-mono">${formatRelativeTime(set.lastManualUpdate)}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', renderCards);

        let countdown = 180;
        setInterval(() => {
            countdown--;
            const cdEl = document.getElementById('countdown');
            if (editingCoin) {
                cdEl.innerHTML = `<span style="color:#fbbf24">⏸ ${countdown}</span>`;
            } else {
                cdEl.style.color = '';
                cdEl.textContent = countdown;
            }
            if (countdown <= 0) { countdown = 180; fetchExchangeData(); }
        }, 1000);

        fetchExchangeData();
    </script>
</body>
</html>
